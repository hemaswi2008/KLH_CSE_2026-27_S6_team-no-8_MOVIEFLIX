<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MovieFlix - Intelligent Movie Search System</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <header class="navbar">
        <div class="logo"><i class="fa-solid fa-film"></i> Movie<span>Flix</span></div>
        <nav class="nav-links">
            <a href="#" onclick="switchTab('home')" class="active"><i class="fa-solid fa-house"></i> Home</a>
            <a href="#" onclick="switchTab('browse')"><i class="fa-solid fa-magnifying-glass"></i> Search & Filter</a>
            <a href="#" onclick="switchTab('watchlist')"><i class="fa-solid fa-heart"></i> Watchlist (<span id="watchlistCount">0</span>)</a>
        </nav>
    </header>

    <main class="main-container">
        <!-- HOME TAB -->
        <section id="tab-home" class="tab-content active">
            <div class="hero-banner">
                <h1>Discover Cinematic Masterpieces</h1>
                <p>Search by title, actor, or genre with typo-tolerant fuzzy matching.</p>
                <div class="hero-search-box">
                    <input type="text" id="homeSearchInput" placeholder="Search movies by title or actor (e.g., Prabhas, Nolan)...">
                    <button onclick="triggerHomeSearch()"><i class="fa-solid fa-search"></i> Find</button>
                </div>
            </div>
            <div class="section-header">
                <h2>Featured Films</h2>
            </div>
            <div id="featuredGrid" class="movie-grid"></div>
        </section>

        <!-- BROWSE & SEARCH TAB -->
        <section id="tab-browse" class="tab-content">
            <div class="filter-panel">
                <div class="search-bar-row">
                    <input type="text" id="browseInput" placeholder="Search by title, actor, or keyword..." oninput="fetchFilteredMovies()">
                    <select id="searchType" onchange="fetchFilteredMovies()">
                        <option value="all">All / Default Search</option>
                        <option value="kmp">KMP Keyword Search</option>
                        <option value="exact">HashMap Exact Search</option>
                        <option value="binary">Binary Search (Sorted Lookup)</option>
                        <option value="fuzzy">Fuzzy Search (Typo tolerant)</option>
                    </select>
                </div>
                <div class="filter-options-row">
                    <select id="filterLang" onchange="fetchFilteredMovies()">
                        <option value="All">All Languages</option>
                        <option value="Telugu">Telugu</option>
                        <option value="Hindi">Hindi</option>
                        <option value="English">English</option>
                    </select>
                    <select id="filterGenre" onchange="fetchFilteredMovies()">
                        <option value="All">All Genres</option>
                        <option value="Action">Action</option>
                        <option value="Sci-Fi">Sci-Fi</option>
                        <option value="Drama">Drama</option>
                        <option value="Comedy">Comedy</option>
                        <option value="Biography">Biography</option>
                    </select>
                    <select id="sortField" onchange="fetchFilteredMovies()">
                        <option value="rating">Merge Sort by Rating</option>
                        <option value="title">Merge Sort by Title</option>
                        <option value="year">Merge Sort by Release Year</option>
                    </select>
                    <select id="sortOrder" onchange="fetchFilteredMovies()">
                        <option value="desc">Descending (High-Low / New-Old)</option>
                        <option value="asc">Ascending (Low-High / Old-New)</option>
                    </select>
                </div>
            </div>
            <div id="browseGrid" class="movie-grid"></div>
        </section>

        <!-- WATCHLIST TAB -->
        <section id="tab-watchlist" class="tab-content">
            <div class="view-header">
                <h2>My Personal Watchlist</h2>
                <p>Movies you have saved as favourites.</p>
            </div>
            <div id="watchlistGrid" class="movie-grid"></div>
        </section>
    </main>

    <!-- MOVIE DETAILS MODAL WITH RECOMMENDATIONS -->
    <div id="detailsModal" class="modal-overlay" style="display:none;">
        <div class="modal-card">
            <button class="modal-close" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></button>
            <div id="modalBody"></div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
